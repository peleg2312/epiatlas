<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EpiAtlas</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --paper: #f4f6f3; --panel: #fff; --line: #d3dbd5; --hair: #e4e9e5; --strong: #b9c4bd;
    --ink: #17324d; --text2: #3c4c47; --muted: #56655f; --sel: #eef2f6;
    --clin: #a35f0a; --clin-ink: #6e3f05; --clin-bg: #fbf3e8; --clin-line: #ecd6b8;
    --mach: #00766a; --mach-ink: #00594f; --mach-bg: #e8f4f2; --mach-line: #b7d9d4;
    font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid #2f6fd6; outline-offset: 2px; }
  h1, h2, p { margin: 0; }
  .muted { color: var(--muted); }

  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 0 28px; min-height: 60px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { font-size: 18px; font-weight: 700; }
  select { padding: 6px 10px; min-height: 36px; border: 1px solid var(--strong); border-radius: 8px; background: var(--panel); }
  #tabs { display: flex; gap: 2px; margin-left: auto; }
  #tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 18px 16px 15px; color: var(--muted); cursor: pointer; font-size: 16px; }
  #tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }

  .wrap { padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1500px; margin: 0 auto; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .push { margin-left: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .split { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .split > .list { flex: 1 1 460px; max-width: 560px; padding: 8px 8px 16px; }
  .split > .viewer { flex: 999 1 560px; }
  .tag { font-size: 13px; padding: 2px 10px; border: 1px solid var(--strong); border-radius: 999px; color: var(--muted); }
  .hyp { padding: 8px 16px; background: var(--clin-bg); border: 1px solid var(--clin-line); border-radius: 10px; color: var(--clin-ink); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.mach { background: var(--mach); } .dot.clin { background: var(--clin); }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--hair); vertical-align: top; }
  th { font-size: 13px; font-weight: 600; color: var(--muted); border-top: 0; }
  .rows tr { cursor: pointer; }
  .rows tr:hover td, .rows tr.on td { background: var(--sel); }
  .rows tr.on td:first-child { box-shadow: inset 3px 0 var(--ink); }
  .rows td { padding: 12px 10px; }
  .rows tr.group { cursor: default; }
  .rows tr.group:hover td { background: none; }
  .rows tr.group th { padding-top: 18px; font-size: 14px; color: inherit; }
  .rows tr.group:first-child th { padding-top: 8px; }
  .warn { padding: 8px 14px; border-radius: 8px; background: var(--clin-bg); border: 1px solid var(--clin-line); color: var(--clin-ink); }
  .rowbtn { all: unset; cursor: pointer; }
  .verdict { padding: 12px 10px 0; font-weight: 600; }
  .others { padding: 0 10px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .linkbtn { background: none; border: 0; padding: 4px 0; text-decoration: underline; cursor: pointer; color: var(--ink); }

  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--strong); border-radius: 8px; background: var(--panel); font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--ink); }
  .btn.icon { width: 44px; padding: 0; }
  .btn.reveal { background: var(--clin); border-color: var(--clin); color: #fff; }
  #eeg { width: 100%; height: max(360px, calc(100vh - 330px)); display: block; }
  #strip { width: 100%; height: 34px; display: block; cursor: pointer; }
  .marks { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; }
  .t-mach { color: var(--mach-ink); } .t-clin { color: var(--clin-ink); }

  .wells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .well { background: #000; aspect-ratio: 1; position: relative; display: grid; place-items: center; border-radius: 8px; overflow: hidden; }
  .well canvas { image-rendering: pixelated; max-width: 100%; max-height: 100%; cursor: crosshair; }
  .well b { position: absolute; color: #9fb3c8; font-size: 12px; font-weight: 500; }
  .doc pre { white-space: pre-wrap; margin: 0; font: inherit; max-width: 70ch; }
  .doc iframe, .doc video { width: 100%; height: 480px; border: 0; }

  .big { font-size: 26px; line-height: 1.3; font-weight: 650; }
  .rank { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1.2fr); gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--hair); }
  .rank small { display: block; font-size: 13px; color: var(--muted); }
  .fill { display: block; height: 10px; border-radius: 3px; background: var(--mach); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { padding: 3px 12px; border-radius: 999px; font-weight: 600; }
  .pill.clin { background: var(--clin-bg); border: 1px solid var(--clin-line); color: var(--clin-ink); }
  .pill.mach { background: var(--mach-bg); border: 1px solid var(--mach-line); color: var(--mach-ink); }
  .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .notice { overflow-wrap: anywhere; font-size: 14px; color: var(--mach-ink); }
  .empty { padding: 48px; text-align: center; color: var(--muted); }

  @media (max-width: 820px) {
    .top, .wrap { padding-left: 16px; padding-right: 16px; } #tabs { margin-left: 0; }
    .wells { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="top">
  <span class="brand">EpiAtlas</span>
  <select id="patient" aria-label="Patient"></select>
  <nav id="tabs" role="tablist" aria-label="Pages">
    <button role="tab" data-page="patient">Patient</button>
    <button role="tab" data-page="machine">Machine</button>
  </nav>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<script src="app.js"></script>      <!-- helpers and the two pages -->
<script src="viewers.js"></script>  <!-- EEG, image, document and semiology viewers -->
<script>
  start().catch((error) => {
    $("#main").innerHTML = `<div class="empty">Could not reach the EpiAtlas server: ${esc(error.message)}</div>`;
  });
</script>
</body>
</html>
